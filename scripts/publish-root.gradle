// Create variables with empty default values
ext["signing.keyId"] = ''
ext["signing.password"] = ''
ext["signing.secretKeyRingFile"] = ''
ext["signing.key"] = ''
ext["ossrhUsername"] = ''
ext["ossrhPassword"] = ''
ext["sonatypeStagingProfileId"] = ''

File secretPropsFile = project.rootProject.file('local.properties')
if (secretPropsFile.exists()) {
    // Local publishing: read local.properties first if it exists
    Properties p = new Properties()
    new FileInputStream(secretPropsFile).withCloseable { is -> p.load(is) }
    p.each { name, value -> ext[name] = value }
} else {
    // CI publishing: use environment variables (see .github/workflows/publish.yml)
    ext["ossrhUsername"] = System.getenv('OSSRH_USERNAME') ?: ''
    ext["ossrhPassword"] = System.getenv('OSSRH_PASSWORD') ?: ''
    ext["sonatypeStagingProfileId"] = System.getenv('SONATYPE_STAGING_PROFILE_ID') ?: ''
    ext["signing.keyId"] = System.getenv('SIGNING_KEY_ID') ?: ''
    ext["signing.password"] = System.getenv('SIGNING_PASSWORD') ?: ''
    ext["signing.secretKeyRingFile"] = System.getenv('SIGNING_SECRET_KEY_RING_FILE') ?: ''
    // ASCII-armoured secret key, used in place of a key ring file on CI
    ext["signing.key"] = System.getenv('SIGNING_KEY') ?: ''
}

// Set up the Sonatype repository.
//
// OSSRH (oss.sonatype.org) was shut down on 30 June 2025. Publishing now goes through the
// Central Portal, which exposes a compatibility endpoint for this plugin. Credentials must be
// a Portal user token (central.sonatype.com, account, "Generate User Token"); OSSRH
// credentials are rejected with a 401. The staging profile id is no longer required.
nexusPublishing {
    // The Sonatype namespace to publish under. The plugin otherwise takes it from the root
    // project's group, which is unset because only the library module declares a group.
    // Keep this in step with PUBLISH_GROUP_ID in app/ephemeral/build.gradle.
    packageGroup = "io.github.ashwinbhaskar"
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username = ossrhUsername
            password = ossrhPassword
            if (sonatypeStagingProfileId) {
                stagingProfileId = sonatypeStagingProfileId
            }
        }
    }
}
